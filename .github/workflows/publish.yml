# Publishes to npm when a GitHub release is published. Uses npm trusted
# publishing (OIDC): no npm token is stored in this repo.
name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Release tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: ./smoke/run.sh
      - run: npm publish --provenance --access public
